<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal · Virtual Assistant</title>
  <!-- Declare a favicon so the browser stops falling back to /favicon.ico (which 404s in console).
       Files in public/ are served from the site root, so public/assets/personal-icon.svg -> /assets/personal-icon.svg.
       SVG scales crisply at any size; apple-touch-icon stays PNG since iOS home-screen icons don't render SVG. -->
  <link rel="icon" type="image/svg+xml" href="/assets/personal-icon.svg" />
  <link rel="apple-touch-icon" href="/assets/personal-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
