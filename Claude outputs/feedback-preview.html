<!doctype html><html><head><meta charset="utf-8"><title>Per-message feedback states</title>
<style>
:root{--brand:#E87511;--brand-d:#c86008;--brand-050:#fff4ea;--surface:#fff;--border:#e6e6e9;--ok:#16a34a;--err:#dc2626;--muted:#6e6e73;--surface-2:#f7f7f8;}
body{font-family:Arial,sans-serif;background:var(--surface-2);padding:24px;color:#1a1a1a;}
.row{display:flex;gap:40px;flex-wrap:wrap;margin-top:8px;}
.case{background:var(--surface-2);padding:14px 16px;border-radius:12px;}
.lbl{font-size:12px;color:var(--muted);margin-bottom:8px;}
/* --- exact rules from styles.css --- */
.msg-fb{display:flex;gap:6px;margin:6px 2px 0;}
.msg-fb__btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:32px;height:28px;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;opacity:.75;transition:transform .1s ease,opacity .1s ease,border-color .1s ease,background .1s ease;}
.msg-fb__btn:hover:not(:disabled){border-color:var(--brand);opacity:1;}
.msg-fb__btn:active:not(:disabled){transform:scale(.92);}
.msg-fb__btn.active{opacity:1;transform:translateY(-1px);}
.msg-fb__btn--up.active{background:rgba(22,163,74,.15);border-color:var(--ok);box-shadow:0 2px 7px rgba(22,163,74,.30);}
.msg-fb__btn--down.active{background:rgba(220,38,38,.13);border-color:var(--err);box-shadow:0 2px 7px rgba(220,38,38,.28);}
.msg-fb--voted .msg-fb__btn:not(.active){opacity:.35;}
.msg-fb--voted .msg-fb__btn:not(.active):hover{opacity:1;}
</style></head><body>
<h3 style="margin:0 0 4px">Per-message feedback — selected state (green/red)</h3>
<div class="row">
  <div class="case"><div class="lbl">No vote yet</div>
    <div class="msg-fb"><button class="msg-fb__btn msg-fb__btn--up">👍</button><button class="msg-fb__btn msg-fb__btn--down">👎</button></div>
  </div>
  <div class="case"><div class="lbl">Thumbs-up selected</div>
    <div class="msg-fb msg-fb--voted"><button class="msg-fb__btn msg-fb__btn--up active">👍</button><button class="msg-fb__btn msg-fb__btn--down">👎</button></div>
  </div>
  <div class="case"><div class="lbl">Thumbs-down selected</div>
    <div class="msg-fb msg-fb--voted"><button class="msg-fb__btn msg-fb__btn--up">👍</button><button class="msg-fb__btn msg-fb__btn--down active">👎</button></div>
  </div>
</div>
<p style="font-size:12.5px;color:var(--muted);max-width:520px">Selected thumb: green tint + green border (up) or red tint + red border (down), lifted slightly. The un-chosen thumb dims to 35% (brightens back on hover, since a vote can be changed).</p>
</body></html>
