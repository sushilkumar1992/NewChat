AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Personal Virtual Assistant backend. Two Lambdas:
   - ApiFunction    : HTTP API for /config, /suggestions and the feedback endpoints.
   - StreamFunction : Function URL (RESPONSE_STREAM) relaying a Bedrock AgentCore runtime.
  The streaming Function URL is PRIVATE (AuthType AWS_IAM). The frontend authenticates with a
  Cognito User Pool, exchanges the login for temporary AWS credentials via a Cognito Identity
  Pool, and SigV4-signs each streaming request — so unsigned/public calls get 403.
  DynamoDB tables are created separately (via the console) and referenced by name below.

Parameters:
  AgentRuntimeArn:
    Type: String
    Description: ARN of the Bedrock AgentCore runtime the streaming Lambda invokes.
  TableName:
    Type: String
    Default: RBPOCTable
    Description: Single DynamoDB table (PK/SK) holding config, suggestions, sessions, messages and feedback.
  FrontendOrigin:
    Type: String
    Description: >
      The EXACT browser origin of the frontend (scheme + host, no trailing slash),
      e.g. https://app.example.com. Used to lock CORS (replaces the old "*").

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

Resources:
  # ---- HTTP API (buffered JSON endpoints) with CORS locked to the frontend origin ----
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api-lambda/
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        GetConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /config
        GetSuggestions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /suggestions
        PostSessionFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /sessions/{sessionId}/feedback
        PostMessageFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /sessions/{sessionId}/messages/feedback

  # ---- Streaming Lambda (Function URL, RESPONSE_STREAM) — PRIVATE (AWS_IAM) ----
  # Only callers holding valid AWS credentials with lambda:InvokeFunctionUrl can invoke it.
  # The frontend gets those creds from the Cognito Identity Pool authenticated role below.
  # The Cors block lets Lambda answer the browser's OPTIONS preflight; AllowHeaders includes the
  # SigV4 headers the signed request carries.
  StreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: streaming-lambda/
      Handler: index.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          TABLE_NAME: !Ref TableName
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - !Ref FrontendOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
            - authorization
            - x-amz-date
            - x-amz-security-token
            - x-amz-content-sha256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub "${AgentRuntimeArn}/*"

  # ======================= Cognito (login + private-invoke credentials) =======================

  # User Pool — holds accounts and performs the login. Admin-created users only (no public sign-up).
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true          # only admins create users
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # App client for the SPA — no client secret (public client), SRP auth flow (used by Amplify).
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # Identity Pool — federates a signed-in User Pool user into temporary AWS credentials.
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${AWS::StackName}_identity"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName
          ServerSideTokenCheck: true

  # Role the Identity Pool hands to authenticated users. Its ONLY permission is to invoke the
  # streaming Function URL — so a logged-in browser can call it, and nothing else.
  IdentityPoolAuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: invoke-stream-function-url
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: !GetAtt StreamFunction.Arn
                Condition:
                  StringEquals:
                    "lambda:FunctionUrlAuthType": AWS_IAM

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt IdentityPoolAuthRole.Arn

Outputs:
  HttpApiBaseUrl:
    Description: Set this as VITE_API_BASE_URL in the frontend .env
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  StreamFunctionUrl:
    Description: Set this as VITE_STREAM_URL — PRIVATE (AWS_IAM); the frontend SigV4-signs it with Cognito creds.
    Value: !GetAtt StreamFunctionUrl.FunctionUrl
  UserPoolId:
    Description: Set this as VITE_COGNITO_USER_POOL_ID
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: Set this as VITE_COGNITO_CLIENT_ID
    Value: !Ref CognitoUserPoolClient
  IdentityPoolId:
    Description: Set this as VITE_COGNITO_IDENTITY_POOL_ID
    Value: !Ref CognitoIdentityPool
  AwsRegion:
    Description: Set this as VITE_AWS_REGION
    Value: !Ref AWS::Region
