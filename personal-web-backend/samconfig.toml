version = 0.1

[default.global.parameters]
stack_name = "personal-web-backend"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "personal-web-backend"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
# Required deploy parameters (no defaults) — pass both at deploy time:
#   AgentRuntimeArn : the Bedrock AgentCore runtime ARN the streaming Lambda invokes
#   FrontendOrigin  : the exact browser origin of the frontend (locks CORS), e.g. https://app.example.com
# Example:
#   sam deploy --parameter-overrides \
#       AgentRuntimeArn=arn:aws:bedrock-agentcore:us-east-2:<acct>:runtime/<id> \
#       FrontendOrigin=https://app.example.com
# TableName is optional (default RBPOCTable):  ... TableName=RBPOCTable
