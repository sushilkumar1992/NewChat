<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Session Explorer — RBPOCTable</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1a2230; --muted:#5b6673; --line:#e3e8f0;
    --brand:#2f5bea; --brand-weak:#e8eefc;
    --up:#0f9d58; --up-weak:#e5f5ec; --down:#d93b3b; --down-weak:#fbe9e9;
    --warn:#b8791f; --warn-weak:#fbf1de; --chip:#eef1f6;
    --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1420; --panel:#171d2b; --ink:#e8ecf4; --muted:#9aa6b8;
      --line:#263042; --brand:#5b82ff; --brand-weak:#1c2a4d;
      --up:#43c07a; --up-weak:#123021; --down:#f2726f; --down-weak:#361a1c;
      --warn:#e0ad57; --warn-weak:#33290f; --chip:#212a3b;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--brand)}
  .wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{font-size:20px;margin:0;font-weight:700}
  header.top .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  button,select,input[type=text],input[type=date]{
    font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;outline:none}
  button{cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.ghost{background:transparent}
  button:focus-visible,select:focus-visible,input:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}

  /* loader */
  #drop{border:2px dashed var(--line);border-radius:14px;background:var(--panel);
    padding:30px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
  #drop.drag{border-color:var(--brand);background:var(--brand-weak)}
  #drop h2{margin:0 0 6px;color:var(--ink);font-size:16px}
  #drop .hint{font-size:12.5px;margin-top:8px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
  .stat .n{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

  /* filters */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 12px;box-shadow:var(--shadow);margin-bottom:14px}
  .filters .f{display:flex;flex-direction:column;gap:4px}
  .filters label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .filters .wide{grid-column:1/-1}
  .filters .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filters select,.filters input{width:100%}
  .resultbar{display:flex;align-items:center;gap:10px;margin:4px 2px 12px;color:var(--muted);font-size:13px;flex-wrap:wrap}

  /* session cards */
  .session{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .s-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
  .s-head:hover{background:var(--chip)}
  .sid{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;font-weight:600}
  .s-meta{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
  .s-body{border-top:1px solid var(--line);padding:6px 14px 14px;display:none}
  .session.open .s-body{display:block}
  .caret{transition:transform .15s;color:var(--muted)}
  .session.open .caret{transform:rotate(90deg)}

  /* messages */
  .msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--bg)}
  .msg .q{font-weight:600;margin-bottom:4px;white-space:pre-wrap}
  .msg .a{white-space:pre-wrap;color:var(--ink)}
  .msg .mmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--muted);font-size:11.5px}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent}
  .b-up{background:var(--up-weak);color:var(--up)}
  .b-down{background:var(--down-weak);color:var(--down)}
  .b-none{background:var(--chip);color:var(--muted)}
  .b-warn{background:var(--warn-weak);color:var(--warn)}
  .b-end{background:var(--brand-weak);color:var(--brand)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Session Explorer</h1>
      <div class="sub">Loads <span class="mono">all-sessions.json</span> (from <span class="mono">export-all-sessions.mjs</span>) and filters by feedback, escalation and more.</div>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="loadBtn">Load JSON…</button>
    <input type="file" id="file" accept="application/json,.json" class="hidden" />
  </header>

  <section id="loader">
    <div id="drop">
      <h2>Drop your <span class="mono">all-sessions.json</span> here</h2>
      <div>or <a href="#" id="pick">choose a file</a></div>
      <div class="hint">Everything runs locally in your browser — nothing is uploaded. Single-session exports (<span class="mono">session-&lt;id&gt;.json</span>) work too.</div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="stats" id="stats"></div>

    <div class="filters">
      <div class="f wide">
        <label for="q">Search (question, answer, session id)</label>
        <input type="text" id="q" placeholder="Type to filter…" />
      </div>
      <div class="f">
        <label for="sessFb">Session feedback</label>
        <select id="sessFb">
          <option value="all">Any</option>
          <option value="up">👍 Up</option>
          <option value="down">👎 Down</option>
          <option value="none">No rating</option>
        </select>
      </div>
      <div class="f">
        <label for="msgFb">Message feedback</label>
        <select id="msgFb">
          <option value="any">Any</option>
          <option value="up">👍 Up</option>
          <option value="down">👎 Down</option>
          <option value="none">No rating</option>
        </select>
      </div>
      <div class="f">
        <label for="esc">Escalation</label>
        <select id="esc"><option value="any">Any</option><option value="yes">Escalated only</option></select>
      </div>
      <div class="f">
        <label for="ended">Ended by LLM</label>
        <select id="ended"><option value="any">Any</option><option value="yes">endSession only</option></select>
      </div>
      <div class="f">
        <label for="from">Started from</label>
        <input type="date" id="from" />
      </div>
      <div class="f">
        <label for="to">Started to</label>
        <input type="date" id="to" />
      </div>
      <div class="f">
        <label for="sort">Sort</label>
        <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select>
      </div>
    </div>

    <div class="resultbar">
      <strong id="count"></strong>
      <div class="spacer"></div>
      <button class="ghost" id="expandAll">Expand all</button>
      <button class="ghost" id="collapseAll">Collapse all</button>
      <button class="ghost" id="reset">Reset filters</button>
    </div>

    <div id="results"></div>
  </section>
</div>

<script>
"use strict";
var STATE = { sessions: [], exportedAt: null };

/* ---------- helpers ---------- */
function escHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtTime(v){
  if(v==null||v==="") return "—";
  var d = (typeof v==="number") ? new Date(v) : new Date(String(v));
  return isNaN(d) ? String(v) : d.toLocaleString();
}
function fmtDur(ms){
  if(ms==null||isNaN(ms)) return "—";
  var s = Math.round(ms/1000), m = Math.floor(s/60); s = s%60;
  return m + "m " + s + "s";
}
function ratingBadge(r){
  if(r==="up") return '<span class="badge b-up">👍 up</span>';
  if(r==="down") return '<span class="badge b-down">👎 down</span>';
  return '<span class="badge b-none">— none</span>';
}
function startMs(sess){
  var s = sess.meta && sess.meta.startedAt;
  if(s){ var d=new Date(s); if(!isNaN(d)) return d.getTime(); }
  var m0 = sess.messages && sess.messages[0];
  return m0 && Number(m0.ts) || 0;
}

/* ---------- load ---------- */
function normalize(obj){
  if(obj && Array.isArray(obj.sessions)) return { sessions: obj.sessions, exportedAt: obj.exportedAt||null };
  if(obj && obj.sessionId && Array.isArray(obj.messages)) return { sessions:[obj], exportedAt: obj.exportedAt||null };
  throw new Error("Unrecognised JSON. Expected an export from export-all-sessions.mjs (has a 'sessions' array) or a single-session export.");
}
function loadObject(obj){
  var norm = normalize(obj);
  norm.sessions.forEach(function(s){ if(!Array.isArray(s.messages)) s.messages=[]; });
  STATE = norm;
  document.getElementById("loader").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
}
function loadText(txt){
  var obj;
  try{ obj = JSON.parse(txt); }catch(e){ alert("That file is not valid JSON.\n\n"+e.message); return; }
  try{ loadObject(obj); }catch(e){ alert(e.message); }
}
function loadFile(file){ var r=new FileReader(); r.onload=function(){ loadText(r.result); }; r.readAsText(file); }

/* ---------- filtering ---------- */
function getFilters(){
  return {
    q: document.getElementById("q").value.trim().toLowerCase(),
    sessFb: document.getElementById("sessFb").value,
    msgFb: document.getElementById("msgFb").value,
    esc: document.getElementById("esc").value,
    ended: document.getElementById("ended").value,
    from: document.getElementById("from").value,
    to: document.getElementById("to").value,
    sort: document.getElementById("sort").value
  };
}
function msgLevelActive(f){ return f.msgFb!=="any" || f.esc==="yes" || f.ended==="yes" || f.q!==""; }

function apply(){
  var f = getFilters();
  var fromMs = f.from ? new Date(f.from+"T00:00:00").getTime() : null;
  var toMs   = f.to   ? new Date(f.to  +"T23:59:59").getTime() : null;
  var out = [];

  STATE.sessions.forEach(function(s){
    var rating = s.meta && s.meta.rating || null;
    // session-level: rating
    if(f.sessFb==="up" && rating!=="up") return;
    if(f.sessFb==="down" && rating!=="down") return;
    if(f.sessFb==="none" && rating) return;
    // session-level: date range on start
    var st = startMs(s);
    if(fromMs!=null && st && st<fromMs) return;
    if(toMs!=null && st && st>toMs) return;

    var sidMatch = f.q!=="" && String(s.sessionId).toLowerCase().indexOf(f.q)>=0;

    var msgs = (s.messages||[]).filter(function(m){
      if(f.msgFb==="up" && m.feedbackRating!=="up") return false;
      if(f.msgFb==="down" && m.feedbackRating!=="down") return false;
      if(f.msgFb==="none" && m.feedbackRating) return false;
      if(f.esc==="yes" && !m.escalation) return false;
      if(f.ended==="yes" && !m.endSession) return false;
      if(f.q!=="" && !sidMatch){
        var t = (String(m.question||"")+" "+String(m.answer||"")+" "+String(m.messageId||"")).toLowerCase();
        if(t.indexOf(f.q)<0) return false;
      }
      return true;
    });

    if(msgLevelActive(f) && msgs.length===0 && !sidMatch) return;
    out.push({ sess:s, msgs: (msgLevelActive(f) ? msgs : (s.messages||[])), rating: rating });
  });

  out.sort(function(a,b){ var d=startMs(a.sess)-startMs(b.sess); return f.sort==="old"? d : -d; });
  return out;
}

/* ---------- render ---------- */
function statTile(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

function render(){
  var rows = apply();
  // stats over the filtered view
  var msgCount=0, up=0, down=0, esc=0, sUp=0, sDown=0;
  rows.forEach(function(r){
    if(r.rating==="up") sUp++; else if(r.rating==="down") sDown++;
    r.msgs.forEach(function(m){
      msgCount++;
      if(m.feedbackRating==="up") up++;
      else if(m.feedbackRating==="down") down++;
      if(m.escalation) esc++;
    });
  });
  document.getElementById("stats").innerHTML =
    statTile(rows.length, "Sessions") +
    statTile(msgCount, "Messages") +
    statTile('<span style="color:var(--up)">'+up+'</span> / <span style="color:var(--down)">'+down+'</span>', "Msg 👍 / 👎") +
    statTile('<span style="color:var(--up)">'+sUp+'</span> / <span style="color:var(--down)">'+sDown+'</span>', "Session 👍 / 👎") +
    statTile(esc, "Escalated msgs");

  document.getElementById("count").textContent =
    rows.length + " session" + (rows.length===1?"":"s") + " · " + msgCount + " message" + (msgCount===1?"":"s");

  var host = document.getElementById("results");
  if(rows.length===0){ host.innerHTML = '<div class="empty">No sessions match these filters.</div>'; return; }

  host.innerHTML = rows.map(function(r){
    var s=r.sess, meta=s.meta||{};
    var head =
      '<div class="s-head" data-t>' +
        '<span class="caret">▶</span>' +
        '<span class="sid">'+escHtml(s.sessionId)+'</span>' +
        ratingBadge(r.rating) +
        (meta.other ? '<span class="badge b-none" title="'+escHtml(meta.other)+'">note</span>' : '') +
        '<div class="spacer"></div>' +
        '<div class="s-meta">' +
          '<span>'+fmtTime(meta.startedAt)+'</span>' +
          '<span>⏱ '+fmtDur(meta.durationMs)+'</span>' +
          '<span>'+r.msgs.length+'/'+(s.messages?s.messages.length:0)+' msgs</span>' +
          (meta.reasons && meta.reasons.length ? '<span>'+escHtml(meta.reasons.join(", "))+'</span>' : '') +
        '</div>' +
      '</div>';

    var body = '<div class="s-body">' + r.msgs.map(function(m){
      var fb = ratingBadge(m.feedbackRating || null);
      var flags = '';
      if(m.escalation) flags += '<span class="badge b-warn">escalation</span>';
      if(m.endSession) flags += '<span class="badge b-end">endSession</span>';
      return '<div class="msg">' +
        '<div class="q">Q: '+escHtml(m.question)+'</div>' +
        '<div class="a">A: '+escHtml(m.answer)+'</div>' +
        '<div class="mmeta">' +
          '<span class="mono">'+escHtml(m.messageId||"")+'</span>' +
          '<span>'+fmtTime(m.ts)+'</span>' + fb + flags +
        '</div>' +
      '</div>';
    }).join("") + '</div>';

    return '<div class="session">'+head+body+'</div>';
  }).join("");

  // wire expand/collapse
  Array.prototype.forEach.call(host.querySelectorAll(".s-head"), function(h){
    h.addEventListener("click", function(){ h.parentNode.classList.toggle("open"); });
  });
}

/* ---------- events ---------- */
["q","sessFb","msgFb","esc","ended","from","to","sort"].forEach(function(id){
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
document.getElementById("expandAll").addEventListener("click", function(){
  Array.prototype.forEach.call(document.querySelectorAll(".session"), function(s){ s.classList.add("open"); }); });
document.getElementById("collapseAll").addEventListener("click", function(){
  Array.prototype.forEach.call(document.querySelectorAll(".session"), function(s){ s.classList.remove("open"); }); });
document.getElementById("reset").addEventListener("click", function(){
  ["q","from","to"].forEach(function(id){ document.getElementById(id).value=""; });
  ["sessFb","msgFb","esc","ended"].forEach(function(id){ document.getElementById(id).selectedIndex=0; });
  document.getElementById("sort").value="new";
  render();
});

var fileInput = document.getElementById("file");
function openPicker(e){ if(e) e.preventDefault(); fileInput.click(); }
document.getElementById("loadBtn").addEventListener("click", openPicker);
document.getElementById("pick").addEventListener("click", openPicker);
fileInput.addEventListener("change", function(){ if(fileInput.files[0]) loadFile(fileInput.files[0]); });

var drop = document.getElementById("drop");
["dragenter","dragover"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("drag"); }); });
["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("drag"); }); });
drop.addEventListener("drop", function(e){ var f=e.dataTransfer.files[0]; if(f) loadFile(f); });
// allow dropping anywhere once loaded
window.addEventListener("dragover", function(e){ e.preventDefault(); });
window.addEventListener("drop", function(e){ e.preventDefault(); var f=e.dataTransfer.files[0]; if(f) loadFile(f); });

// best-effort auto-load when served over http(s) from the same folder
(function(){
  if(location.protocol==="file:") return;
  fetch("./all-sessions.json").then(function(r){ return r.ok? r.text(): null; })
    .then(function(t){ if(t) loadText(t); }).catch(function(){});
})();
</script>
</body>
</html>
